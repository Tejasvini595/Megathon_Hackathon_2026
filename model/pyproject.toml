[project]
name = "greenhome"
version = "0.1.0"
description = "Green Home Score & Retrofit Engine (Megathon X, Lloyds PS2)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas==2.3.1",
    "numpy==2.3.2",
    "scikit-learn==1.9.1",
    "lightgbm==4.6.0",
    "scipy==1.17.0",
    "pyarrow==20.0.0",
    "joblib==1.5.1",
    "anthropic==0.75.0",
    "plotly==6.7.0",
    "streamlit==1.65.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "hypothesis==6.168.5",
]

[tool.uv]
package = false
